[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-tamp-grounding"
version = "0.1.0"
description = "LIBERO grounding evaluation, Stage 1 of constrained TAMP with ST-pRRTC"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8,<3", "Pillow>=10,<12", "PyYAML>=6,<7", "numpy>=1.22,<2"]

[project.optional-dependencies]
api = ["openai>=2,<3", "google-genai>=1,<3"]
rgb-choices = ["opencv-python>=4.6,<4.12", "scipy>=1.10,<1.11"]
landmarks = ["scikit-learn>=1.2,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
vlm-tamp = "vlm_tamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real LIBERO rendering (explicit opt-in)"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E9", "F"]

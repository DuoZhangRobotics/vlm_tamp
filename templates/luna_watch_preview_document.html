<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; object-src 'none'">
  <title>Luna experiments — saved inspection</title>
  <style>
    :root { color-scheme: light dark; --foreground: light-dark(#203249,#edf1f6); --background: light-dark(#fff,#17212b); --muted-foreground: light-dark(#536276,#b7c5d5); --border: light-dark(#d6dfeb,#45596d); font: 16px system-ui; color: var(--foreground); background: var(--background); }
    body { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    h2,h3,th { font-weight: 500; }
    .text-muted { color: var(--muted-foreground); }
    .text-small { font-size: 14px; }
    .viz-row,.viz-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .form-label { display: grid; gap: 6px; width: 100%; min-width: 0; }
    .form-select,.btn { font: inherit; padding: 8px; max-width: 100%; }
    .form-select { width: 100%; min-width: 0; }
    .table-responsive { overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; }
    .table th,.table td { text-align: left; padding: 7px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
    summary { cursor: pointer; padding-block: 6px; }
  </style>
</head>
